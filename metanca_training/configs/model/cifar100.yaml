use_bias: true

# Train architectures at opposite ends of architecture line segment
# Test architecture (m=0.2) is in the middle
archs:
  # Smaller end: m=0.1 multiplier
  - _target_: metanca.nn.ConvMLP
    conv_layer_specs:
      - [6, [3, 3], [2, 2], [2, 2]]
      - [12, [3, 3], [2, 2], [2, 2]]
      - [25, [3, 3], [2, 2], [2, 2]]
    mlp_layer_specs: [204, 100] # int(2048 * 0.1), output_shape
    conv_use_bias: ${model.use_bias}
    mlp_use_bias: ${model.use_bias}
    padding: VALID
    strides: 1
    activation: leaky_relu
  # Larger end: m=0.3 multiplier
  - _target_: metanca.nn.ConvMLP
    conv_layer_specs:
      - [19, [3, 3], [2, 2], [2, 2]]
      - [38, [3, 3], [2, 2], [2, 2]]
      - [76, [3, 3], [2, 2], [2, 2]]
    mlp_layer_specs: [614, 100] # int(2048 * 0.3), output_shape
    conv_use_bias: ${model.use_bias}
    mlp_use_bias: ${model.use_bias}
    padding: VALID
    strides: 1
    activation: leaky_relu

# Test architecture: m=0.2 multiplier (middle of the line segment)
test_arch:
  _target_: metanca.nn.ConvMLP
  conv_layer_specs:
    - [12, [3, 3], [2, 2], [2, 2]]
    - [25, [3, 3], [2, 2], [2, 2]]
    - [51, [3, 3], [2, 2], [2, 2]]
  mlp_layer_specs: [409, 100] # int(2048 * 0.2), output_shape
  conv_use_bias: ${model.use_bias}
  mlp_use_bias: ${model.use_bias}
  padding: VALID
  strides: 1
  activation: leaky_relu

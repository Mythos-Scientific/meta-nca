lr: 0.001
num_epochs: 1
num_metaepochs: 100000
grad_clip_norm: 1.0
weight_transformer_dropout: 0.0
prop_cells_updated: 0.8
update_step_scheduler_type: increment
update_step_scheduler_rate: 100
update_step_scheduler_max_steps: 10

early_stopping_enabled: true
early_stopping_patience: 10

sample_pooling:
  enabled: false
  pool_size: 64
  seed_fraction: 0.2
  loss_spike_multiplier: 10.0
  max_consecutive_rollbacks: 3
